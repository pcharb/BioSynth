<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerveau 3D</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--BgCanvas); color: var(--TextPrimary); overflow: hidden; }
  .view-bar .grp { display: flex; gap: 4px; align-items: center; }
  .view-bar button { font: inherit; font-size: 10px; background: var(--BgInset); color: var(--TextPrimary); border: 1px solid var(--Border); border-radius: 3px; padding: 3px 8px; cursor: pointer; }
  .view-bar button:hover { border-color: var(--Brand); }
  .view-bar .sep { width: 1px; height: 18px; background: var(--Border); }
  #stage { position: relative; flex: 1; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #labels span { position: absolute; transform: translate(6px, -50%); font: bold 9px monospace; color: var(--TextPrimary); white-space: nowrap;
    text-shadow: 0 0 3px var(--BgCanvas), 0 0 2px var(--BgCanvas), 0 0 1px var(--BgCanvas); }
  .view-foot { justify-content: space-between; }
  #msg { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--BgPanel); border: 1px solid var(--Warn); padding: 6px 12px; border-radius: 4px; font-size: 10px; color: var(--TextPrimary); pointer-events: none; }
</style>
</head>
<body>
  <div class="view-bar">
    <span class="logo-mark" role="img" aria-label="CIRICS"></span><b>CERVEAU 3D</b>
    <label><input type="checkbox" id="chkHeat" checked> Heatmap</label>
    <label><input type="checkbox" id="chkElec" checked> Électrodes</label>
    <label><input type="checkbox" id="chkLabels"> Labels</label>
    <label><input type="checkbox" id="chkRotate"> Rotation auto</label>
    <span class="sep"></span>
    <span class="grp">Vue
      <button data-view="front">Face</button><button data-view="top">Dessus</button>
      <button data-view="left">Gauche</button><button data-view="right">Droite</button><button data-view="back">Arrière</button>
    </span>
    <span class="sep"></span>
    <span class="grp">Modèle <span id="modelName">procédural</span>
      <button id="btnObj" title="Charger un maillage anatomique (.obj)">OBJ…</button>
      <button id="btnTurn" title="Pivoter le modèle OBJ de 90° autour de la verticale">↻ 90°</button>
      <button id="btnUp" title="Basculer l'axe vertical du modèle OBJ (Y ou Z)">Axe Y</button>
      <button id="btnProc" title="Revenir au cerveau procédural">Procédural</button>
    </span>
    <input type="file" id="fileObj" accept=".obj" hidden>
    <span id="conn" class="conn">○ connexion…</span>
  </div>
  <div id="stage"><div id="labels"></div><div id="msg" hidden></div></div>
  <div class="view-foot">
    <span id="info">—</span>
    <span class="seq-legend">Faible <span class="seq-grad"></span> Fort</span>
    <span>Glisser : rotation · Molette : zoom · Clic droit : déplacer</span>
  </div>

<script src="theme.js"></script>
<script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js" } }</script>
<script type="module" src="brain3d.js"></script>
</body>
</html>
